name: Install dependencies
description: Restore every workspace's node_modules from a cache, or run npm ci on a miss.

runs:
  using: composite
  steps:
    - id: node
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    # npm ci generates the Prisma client in its postinstall; the schema is not part of the
    # cache key, so a hit generates it again.
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: npm run generate
