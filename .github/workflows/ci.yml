name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A later push to a pull request cancels its earlier run. A push never cancels another:
# each push run gets a group of its own.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: ./.github/actions/install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  guardrails:
    # The CI checks in scripts/. Every check runs, so one failure does not hide the next.
    name: Guardrails
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request checks read every commit between base and head.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - id: install
        run: npm ci
      - name: npm only
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-package-manager.ts
      - name: Every test file belongs to a Vitest project
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-test-projects.ts
      - name: Every use case has a test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/check-use-case-tests.ts
      - name: Red-green evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node scripts/check-red-green-evidence.ts "$BASE_SHA" "$HEAD_SHA"
      - name: No em dash
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' }}
        run: node scripts/check-em-dash.ts "$BASE_SHA" "$HEAD_SHA"


  integration:
    name: Sign-in Postgres and released core scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: ./.github/actions/install
      - run: npm test -- --project sign-in:integration --reporter verbose
      - run: npm run build

  browser:
    name: Approved sign-in phone and desktop journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: ./.github/actions/install
      - run: npm exec playwright install --with-deps chromium
      - run: npm test -- --project sign-in:browser --reporter verbose

  image:
    name: Runnable sign-in image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker buildx build --load --tag aeolus-sign-in:check .
      - run: docker run --rm --pids-limit=128 aeolus-sign-in:check keygen --file /tmp/sign-in-smoke.pem
